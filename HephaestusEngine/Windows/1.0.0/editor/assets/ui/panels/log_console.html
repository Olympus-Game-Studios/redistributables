<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Console</title>
  <style>
    body { margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#0e1117; color:#d9dee8; }
    .hdr { padding:10px 12px; border-bottom:1px solid #22283a; background:#0b0f14; font-family: -apple-system, Segoe UI, Arial, sans-serif; font-weight:600; }
    #log { padding:10px 12px; white-space:pre-wrap; font-size:12px; line-height:1.45; }
    .line { color:#c7d2fe; }
  </style>
</head>
<body>
  <div class="hdr">Log Console (HTML)</div>
  <div id="log"></div>

  <script>
    function append(line) {
      const el = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = line;
      el.appendChild(div);
    }

    window.hepReceive = function(msg) {
      append('[event] ' + JSON.stringify(msg));
    };

    append('Log panel ready.');
  </script>
</body>
</html>
