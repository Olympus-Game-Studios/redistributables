<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Bar</title>
    <link rel="stylesheet" href="titlebar.css">
</head>
<body>
    <div class="titlebar">
        <div class="titlebar-title">
            <img src="assets/AtlasLogo.png" class="titlebar-logo" alt="Atlas Core Logo">
            <span class="titlebar-text">Atlas Core</span>
        </div>
        
        <div class="titlebar-controls">
            <button class="titlebar-button minimize-btn" title="Minimize" aria-label="Minimize window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
            
            <button class="titlebar-button maximize-btn" title="Maximize" aria-label="Maximize window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                </svg>
            </button>
            
            <button class="titlebar-button restore-btn hidden" title="Restore" aria-label="Restore window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
            </button>
            
            <button class="titlebar-button close-btn" title="Close" aria-label="Close window">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="link-handler.js"></script>
    <script src="titlebar.js"></script>
</body>
</html>
