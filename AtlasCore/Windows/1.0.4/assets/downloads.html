<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads - Atlas Core</title>
    <link rel="stylesheet" href="content.css">
    <link rel="stylesheet" href="downloads.css">
</head>
<body>
    <div class="content-container">
        <div class="downloads-header">
            <h1>Downloads & Updates</h1>
            <button class="btn-primary" id="check-updates">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23,4 23,10 17,10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Check for Updates
            </button>
        </div>

        <div class="downloads-grid" id="downloads-grid">
            <!-- Content will be populated by JavaScript -->
            <div class="loading-state">
                <svg class="spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23,4 23,10 17,10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                <p>Loading downloads...</p>
            </div>
        </div>
    </div>

    <script src="link-handler.js"></script>
    <script src="downloads.js"></script>
</body>
</html>
